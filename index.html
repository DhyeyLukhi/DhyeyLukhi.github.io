<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dhyey Lukhi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="odometer.css">
</head>

  <div class="top-layer">
    <div class="photo-frame"></div>
    <img class="magnifying-glass" src="magnyfying glass.png" alt="Magnifying Glass" />
  </div>

  <div class="shelf-wrapper">
    <div class="shelf" id="shelf1"></div>
    <div class="shelf" id="shelf2">
      <div class="books-row">
        <div class="book linkedin" id="linkedinBook" data-file="linkedin.json">
          <div class="cover">
            <div class="logo"><img src="linkedin.png" alt="LinkedIn" style="width:28px;height:28px;"></div>
            <div class="label">LinkedIn</div>
          </div>
        </div>
        <div class="book github" id="githubBook" data-file="github.json">
          <div class="cover">
            <div class="logo"><img src="github.png" alt="GitHub" style="width:28px;height:28px;"></div>
            <div class="label">GitHub</div>
          </div>
        </div>
      </div>
    </div>
    <div class="shelf" id="shelf3">
      <div class="time-row desktop" aria-hidden="false">
        <img src="time-bullet.svg" alt="bullet" class="time-icon bullet">
        <img src="time-blitz.svg" alt="blitz" class="time-icon blitz">
        <img src="time-rapid.svg" alt="rapid" class="time-icon rapid">
        <img src="time-daily.svg" alt="daily" class="time-icon daily">
        <img src="time-live960.svg" alt="live960" class="time-icon live960">
      </div>
    </div>
    <div class="shelf" id="shelf4"></div>
    <div class="shelf" id="shelf5"></div>
    <div class="shelf" id="shelf6">
      <div class="time-row mobile" aria-hidden="true">
        <img src="time-bullet.svg" alt="bullet" class="time-icon bullet">
        <img src="time-blitz.svg" alt="blitz" class="time-icon blitz">
      </div>
    </div>
    <div class="shelf" id="shelf7">
      <div class="time-row mobile" aria-hidden="true">
        <img src="time-rapid.svg" alt="rapid" class="time-icon rapid">
        <img src="time-daily.svg" alt="daily" class="time-icon daily">
      </div>
    </div>
    <div class="shelf" id="shelf8">
      <div class="time-row mobile" aria-hidden="true">
        <img src="time-live960.svg" alt="live960" class="time-icon live960">
      </div>
    </div>
  </div>

  <!-- Photo Modal -->
  <div class="photo-modal" id="photoModal">
    <div class="photo-modal-content">
      <img src="photo.jpg" alt="Profile Photo Large">
    </div>
  </div>

  <div class="book-modal" id="bookModal">
    <div class="book-scene">
      <div class="book-inner" id="bookInner">
        <!-- Pages will be injected here -->
        <div class="close-btn" id="closeBook" title="Close">✕</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.co/gsap@3/dist/gsap.min.js"></script>
  <script src="https://assets.codepen.io/16327/MorphSVGPlugin3.min.js"></script>
  <script src="https://unpkg.com/gsap@3/dist/Draggable.min.js"></script>
  <script src="bulb.js"></script>
  <script src="odometer.js"></script>
  <script src="index.js"></script>
</body>

</html>
